version: "3.8"

services:
  eventdispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-dispatcher
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ADMIN_TOKEN=change-me-to-a-strong-token
      - ADDR=:8080
      - DB_PATH=/app/data/dispatcher.db
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
