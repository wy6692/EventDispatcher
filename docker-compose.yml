services:
  eventdispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-dispatcher
    restart: always
    ports:
      - "0.0.0.0${ADDR:-:8080}${ADDR:-:8080}"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - ADDR=${ADDR:-:8080}
      - DB_PATH=/app/data/dispatcher.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1${ADDR:-:8080}/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
