              <text x="16" y="29" class="mono" font-size="9" fill="#38bdf8">global_user</text>
              <text x="180" y="21" class="mono" font-size="10" fill="#8b949e">wxf321***08</text>
              <rect x="290" y="12" width="44" height="16" rx="2" fill="rgba(63, 185, 80, 0.12)" stroke="rgba(63, 185, 80, 0.25)"/>
