        <circle cx="16" cy="14" r="3" fill="#38bdf8"/>
        <text x="28" y="18" class="sans" font-size="11" font-weight="500" fill="#ffffff">系统概览</text>
      </g>

      <!-- Nav Item: 微信服务号 -->
      <g transform="translate(10, 116)">
        <text x="28" y="18" class="sans" font-size="11" fill="#8b949e">微信服务号</text>
      </g>

      <!-- Nav Item: 下游订阅与路由 -->
