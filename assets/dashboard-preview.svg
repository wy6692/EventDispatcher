<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .text-title { font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .text-sub { font-size: 11px; fill: #8b949e; }
      .text-muted { font-size: 10px; fill: #6e7681; }
      .pill { font-size: 10px; font-family: ui-monospace, Menlo, monospace; }
      .grid-line { stroke: rgba(255, 255, 255, 0.06); stroke-width: 1; }
    </style>
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14171f"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 外层画布背景 -->
  <rect width="1200" height="780" fill="#07080a"/>
  <!-- 微弱背景网格 -->
  <g stroke="rgba(255, 255, 255, 0.02)" stroke-width="1">
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="650" x2="1200" y2="650"/>
    <line x1="240" y1="0" x2="240" y2="780"/>
    <line x1="480" y1="0" x2="480" y2="780"/>
    <line x1="720" y1="0" x2="720" y2="780"/>
    <line x1="960" y1="0" x2="960" y2="780"/>
